name: Compilar y Publicar Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Configurar JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Generar Wrapper de Gradle compatible (8.7)
      run: gradle wrapper --gradle-version 8.7

    - name: Compilar APK Debug
      run: ./gradlew clean assembleDebug --no-daemon

    - name: Renombrar APK
      run: mv app/build/outputs/apk/debug/app-debug.apk MediaDownloader.apk

    - name: Subir APK como artefacto
      uses: actions/upload-artifact@v4
      with:
        name: MediaDownloader-APK
        path: MediaDownloader.apk

    - name: Crear Release en GitHub
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: MediaDownloader.apk
        name: MediaDownloader Release
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
